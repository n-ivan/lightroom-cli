[package]
name = "lrcli"
version = "0.1.0"
edition = "2024"
description = "Control Adobe Lightroom Classic from the command line"
license = "MIT"
repository = "https://github.com/n-ivan/lightroom-cli"
publish = false

[lib]
name = "lrcli"
path = "src/lib.rs"

[[bin]]
name = "lrcli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros", "sync", "signal"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["process"] }
